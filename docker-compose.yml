version: "3.9"

services:
  mongo:
    image: mongo:6
    container_name: agriher-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpass
    ports:
      - "27017:27017"

  backend:
    build:
      context: ./backend
    container_name: agriher-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://root:rootpass@mongo:27017/?authSource=admin
      MONGO_DB: agriher
      CORS_ALLOW_ORIGINS: http://localhost,http://localhost:80,http://localhost:5173
    depends_on:
      - mongo
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend/agriher-frontend
    container_name: agriher-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://backend:8000
      VITE_SOS_WS: ws://backend:8000/safety/ws/sos
    depends_on:
      - backend
    ports:
      - "80:80"


